name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Steps to reproduce, expected and actual behaviour. Screenshots help.
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      placeholder: e.g. net10.0-desktop on macOS 15, WebAssembly (Chrome 140)
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: RibbonSpace / Uno.Sdk version
      placeholder: 1.0.0 / 6.7.30
