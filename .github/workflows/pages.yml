name: Gallery (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  # Never cancel a deployment half-way (GitHub's Pages starter workflow does the same).
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Install WebAssembly workload
        run: dotnet workload install wasm-tools --skip-manifest-update
      - name: Publish the WebAssembly gallery
        run: dotnet publish samples/RibbonSpace.Demo/RibbonSpace.Demo.csproj -f net10.0-browserwasm -c Release -p:DemoTargetFrameworks=net10.0-browserwasm -p:WasmShellWebAppBasePath=/RibbonSpace/ -o artifacts/browser
      - name: Prepare site
        run: |
          mkdir -p artifacts/site
          cp -r artifacts/browser/wwwroot/. artifacts/site/
          touch artifacts/site/.nojekyll
          cp artifacts/site/index.html artifacts/site/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: artifacts/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Pages must be enabled once with Settings > Pages > Source = "GitHub Actions" (see docs/releasing.md);
      # the default GITHUB_TOKEN cannot enable it.
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
